<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ainda mexendo com formulários </h1>
    <form action="" method="get" autocomplete="on"> 
        <p>
            <label for="inum1">Digite um número:</label>
            <input type="number" name="num1 " id="inum1" min="0" max="100" required
            oninput="isoma.innerHTML = Number(num1.value) + Number(num2.value)">
        </p>

        <p>
            <label for="inum2">Digite o segundo número: </label>
            <input type="number" name="num2" id="inum2" min="0" max="100" required>
        </p>

        <p>
            <label for="isoma">Soma:</label>
            <output id="isoma">0</output>
        </p>


        <p>
            <input type="submit" value="login">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
