<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Testando formulários</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="i_name">Nome:</label>
            <input type="text" name="name" id="i_name" required maxlength="40" placeholder="Nome Completo" autocomplete="name">
        </p>
        <p>
            <label for="i_media">Média</label>
            <input type="number" name="média" id="i_media" min="0" max="10" placeholder="0 a 10" step="0.1">
        </p>
        <p>
            <label for="i_media">Dia da Prova</label>
            <input type="date" name="dia" id="i_dia">
        </p>
        <p>
            <label for="i_mes">Periodo letivo</label>
            <input type="month" name="mes" id="i_mes" value="2025-12">
        </p>
        <p>
            <label for="i_hora">Horario da Prova</label>
            <input type="time" name="hora " id="i_hora">
        </p>
        <p>
            <input type="submit" value="login">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
