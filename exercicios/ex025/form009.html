<!DOCTYPE html>
<html lang=pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" >
        <label for="inum">Número</label>
        <input type="range" name="num " id="inum" min="0" max="10" oninput="mostra.innerHTML = Number(inum.value)">
        <output id="mostra">5</output>
    </form>
</body>
</html>
